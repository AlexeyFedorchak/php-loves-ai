# Builds the puller and runner binaries on every supported platform and attaches them to a GitHub release,
# where `vendor/bin/setup` downloads them from.
#
# Runs when a release is published; can also be started by hand for an existing release tag.
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the binaries to, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x86_64
            docker-platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            docker-platform: linux/arm64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Linux: built in Docker on an old glibc, so the binaries run on older distributions too.
      - name: Build and package (Linux, in Docker)
        if: runner.os == 'Linux'
        run: python/build-in-docker.sh "${{ matrix.docker-platform }}" "$RUNNER_TEMP/release"

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'

      - name: Build and package
        if: runner.os != 'Linux'
        env:
          PYTHON: python
        run: |
          test "$(python/platform.sh)" = "${{ matrix.platform }}"
          python/puller/build.sh
          python/runners/text-to-image/build.sh
          python/runners/text-to-text/build.sh
          python/runners/image-to-text/build.sh
          python/runners/speech-to-text/build.sh
          python/runners/text-to-speech/build.sh
          python/runners/image-to-image/build.sh
          python/package.sh "$RUNNER_TEMP/release"

      - name: Check all assets were built
        run: |
          for tool in puller text-to-image text-to-text image-to-text speech-to-text text-to-speech image-to-image; do
            test -f "$RUNNER_TEMP/release/$tool-${{ matrix.platform }}.tar.gz"
            test -f "$RUNNER_TEMP/release/$tool-${{ matrix.platform }}.tar.gz.sha256"
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber --repo "$GITHUB_REPOSITORY"
