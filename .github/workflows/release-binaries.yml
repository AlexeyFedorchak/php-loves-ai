# Builds the puller and runner binaries on every supported platform and attaches them to a GitHub release,
# where `vendor/bin/setup` downloads them from.
#
# Runs when a release is published; can also be started by hand for an existing release tag.
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the binaries to, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x86_64
            torch-index-url: https://download.pytorch.org/whl/cpu
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            torch-index-url: https://download.pytorch.org/whl/cpu
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      TORCH_INDEX_URL: ${{ matrix.torch-index-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check platform name
        run: test "$(python/platform.sh)" = "${{ matrix.platform }}"

      - name: Build puller
        run: python/puller/build.sh

      - name: Build text-to-image runner
        run: python/runners/text-to-image/build.sh

      - name: Package release assets
        run: python/package.sh "$RUNNER_TEMP/release"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber --repo "$GITHUB_REPOSITORY"
